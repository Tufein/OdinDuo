plugins { id 'com.android.application' }

android {
    namespace 'nl.retroid.touchguard'
    compileSdk 36
    defaultConfig {
        // Keep the existing package so updates preserve the working Odin installation.
        applicationId 'nl.retroid.touchguard'
        minSdk 33
        targetSdk 36
        versionCode 21
        versionName '2.0.1'
        testInstrumentationRunner 'nl.retroid.touchguard.ReliabilityInstrumentation'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res', layout.buildDirectory.dir('generated/guard-res')]
        }
        androidTest { java.srcDirs = ['androidTest'] }
    }
    buildFeatures { buildConfig true }
    // Always include both languages, including in any future App Bundle distribution.
    bundle { language { enableSplit = false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            // Preserve updates for existing users. The private key stays outside Git.
            def releaseKey = file(System.getenv('ODINDUO_KEYSTORE') ?: 'build/debug.keystore')
            if (releaseKey.exists()) {
                storeFile releaseKey
                storePassword System.getenv('ODINDUO_STORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ODINDUO_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('ODINDUO_KEY_PASSWORD') ?: 'android'
            }
        }
        debug {
            // Reuse the local test key when present; never publish it.
            def existingKey = file('build/debug.keystore')
            if (existingKey.exists()) {
                storeFile existingKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.localRelease
        }
    }
}

def guardResources = tasks.register('generateGuardResources', Copy) {
    from(rootProject.file('tools/pserver-power-guard.sh'), rootProject.file('tools/pserver-power-stop.sh'))
    into(layout.buildDirectory.dir('generated/guard-res/raw'))
    rename { name -> name == 'pserver-power-guard.sh' ? 'power_guard.sh' : 'power_stop.sh' }
}
tasks.named('preBuild').configure { dependsOn guardResources }

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
}
