plugins { id 'com.android.application' }

android {
    namespace 'nl.retroid.touchguard'
    compileSdk 36
    defaultConfig {
        // Keep the existing package so updates preserve the working Odin installation.
        applicationId 'nl.retroid.touchguard'
        minSdk 33
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res', layout.buildDirectory.dir('generated/guard-res')]
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            // Reuse the local test key when present; never publish it.
            def existingKey = file('build/debug.keystore')
            if (existingKey.exists()) {
                storeFile existingKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}

def guardResources = tasks.register('generateGuardResources', Copy) {
    from(rootProject.file('tools/pserver-power-guard.sh'))
    into(layout.buildDirectory.dir('generated/guard-res/raw'))
    rename { 'power_guard.sh' }
}
tasks.named('preBuild').configure { dependsOn guardResources }

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
