plugins { id 'com.android.application' }

android {
    namespace 'nl.retroid.touchguard'
    compileSdk 36
    defaultConfig {
        // Keep the existing package so updates preserve the working Odin installation.
        applicationId 'nl.retroid.touchguard'
        minSdk 33
        targetSdk 36
        versionCode 24
        versionName '2.0.2-beta.3'
        testInstrumentationRunner 'nl.retroid.touchguard.ReliabilityInstrumentation'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res', layout.buildDirectory.dir('generated/guard-res')]
        }
        androidTest { java.srcDirs = ['androidTest'] }
    }
    sourceSets.test.java.srcDirs = ['ui-tests']
    testOptions.unitTests.includeAndroidResources = true
    buildFeatures { buildConfig true }
    // Always include both languages, including in any future App Bundle distribution.
    bundle { language { enableSplit = false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            // Preserve updates for existing users. The private key stays outside Git.
            def customKey = System.getenv('ODINDUO_KEYSTORE')
            if (customKey != null) {
                // A custom key must never fall back to the test passwords below.
                ['ODINDUO_STORE_PASSWORD', 'ODINDUO_KEY_ALIAS', 'ODINDUO_KEY_PASSWORD'].each { name ->
                    if (System.getenv(name) == null) {
                        throw new GradleException("ODINDUO_KEYSTORE is set, so ${name} must be set too.")
                    }
                }
            }
            def releaseKey = file(customKey ?: 'build/debug.keystore')
            if (releaseKey.exists()) {
                storeFile releaseKey
                storePassword customKey != null ? System.getenv('ODINDUO_STORE_PASSWORD') : 'android'
                keyAlias customKey != null ? System.getenv('ODINDUO_KEY_ALIAS') : 'androiddebugkey'
                keyPassword customKey != null ? System.getenv('ODINDUO_KEY_PASSWORD') : 'android'
            }
        }
        debug {
            // Reuse the local test key when present; never publish it.
            def existingKey = file('build/debug.keystore')
            if (existingKey.exists()) {
                storeFile existingKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.localRelease
        }
    }
}

def guardResources = tasks.register('generateGuardResources', Copy) {
    from(rootProject.file('tools/pserver-power-guard.sh'), rootProject.file('tools/pserver-power-stop.sh'))
    into(layout.buildDirectory.dir('generated/guard-res/raw'))
    rename { name -> name == 'pserver-power-guard.sh' ? 'power_guard.sh' : 'power_stop.sh' }
}
tasks.named('preBuild').configure { dependsOn guardResources }

// A release build without its key would be unsigned and silently unusable for updates. Fail early.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.startsWith('assemble') && task.name.endsWith('Release')
    }
    def releaseKey = file(System.getenv('ODINDUO_KEYSTORE') ?: 'build/debug.keystore')
    if (releaseRequested && !releaseKey.exists()) {
        throw new GradleException("Release build needs the signing key at ${releaseKey}. Set ODINDUO_KEYSTORE to it.")
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
}

tasks.withType(Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}
